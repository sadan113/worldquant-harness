services:
  worldquant_harness:
    build: .
    ports:
      - "8003:8003"
    volumes:
      - worldquant-harness-data:/app/data
      - worldquant-harness-reports:/app/reports
      - worldquant-harness-state:/app/state
    env_file:
      - .env
    environment:
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/state/worldquant_harness.db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  worldquant-harness-data:
  worldquant-harness-reports:
  worldquant-harness-state:
