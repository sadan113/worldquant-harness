<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Fine-grained submission failure taxonomy</title>
<desc id="desc">Submission failures are classified into operational causes and mapped to concrete repair actions.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5c6670"/>
  </marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #17202a; letter-spacing: 0; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5c6670; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; fill: #5c6670; }
    .tiny { font-size: 12px; fill: #5c6670; }
    .metric { font-size: 20px; font-weight: 700; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="54" class="title">Failure taxonomy: every reject should imply a different repair</text>
<text x="48" y="82" class="subtitle">The updated skill memory splits failures by cause instead of storing one coarse rejection bucket.</text>

<rect x="410" y="238" width="300" height="116" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="434" y="270" class="label">Submission blocker record</text>
<text x="434" y="298" class="body">observed metric + related alpha +</text>
<text x="434" y="316" class="body">family signature + platform result</text>
<text x="434" y="334" class="body">become a typed repair route</text>

<rect x="64" y="138" width="282" height="96" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<text x="84" y="168" class="label">Clone / self-correlation</text>
<text x="84" y="194" class="body">0.97+ related values after a</text>
<text x="84" y="212" class="body">nearby family becomes ACTIVE</text>

<rect x="64" y="282" width="282" height="96" rx="8" fill="#fff4df" stroke="#c47f17" stroke-width="2"/>
<text x="84" y="312" class="label">Crowded but useful</text>
<text x="84" y="338" class="body">strong metrics with related</text>
<text x="84" y="356" class="body">values near the submit cutoff</text>

<rect x="64" y="426" width="282" height="96" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="84" y="456" class="label">Weak or unstable signal</text>
<text x="84" y="482" class="body">low Sharpe/Fitness, negative</text>
<text x="84" y="500" class="body">returns, or turnover instability</text>

<rect x="774" y="138" width="282" height="96" rx="8" fill="#fff4df" stroke="#c47f17" stroke-width="2"/>
<text x="794" y="168" class="label">Concentration / coverage</text>
<text x="794" y="194" class="body">short tenor or sparse fields can</text>
<text x="794" y="212" class="body">pass metrics but fail robustness</text>

<rect x="774" y="282" width="282" height="96" rx="8" fill="#e8f6ee" stroke="#1f9d55" stroke-width="2"/>
<text x="794" y="312" class="label">Platform PASS mismatch</text>
<text x="794" y="338" class="body">platform result passes while strict</text>
<text x="794" y="356" class="body">numeric runner cutoff would block</text>

<rect x="774" y="426" width="282" height="96" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="794" y="456" class="label">Unit / operator issue</text>
<text x="794" y="482" class="body">operation semantics or field unit</text>
<text x="794" y="500" class="body">assumption needs probing</text>

<line x1="346" y1="186" x2="410" y2="266" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="346" y1="330" x2="410" y2="296" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="346" y1="474" x2="410" y2="330" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710" y1="266" x2="774" y2="186" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710" y1="296" x2="774" y2="330" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="710" y1="330" x2="774" y2="474" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="88" y="552" width="236" height="54" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="104" y="576" class="body">Repair</text>
<text x="104" y="596" class="label">change field family, not tiny knobs</text>

<rect x="442" y="552" width="236" height="54" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="458" y="576" class="body">Record</text>
<text x="458" y="596" class="label">tweak, result, cause, next action</text>

<rect x="796" y="552" width="236" height="54" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="812" y="576" class="body">Policy</text>
<text x="812" y="596" class="label">separate strict cutoff from PASS</text>

<text x="48" y="626" class="tiny">What this proves: failure memory is actionable only when the blocker taxonomy is specific enough to choose a different next move.</text>
</svg>
