<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Skill system effect comparison</title>
<desc id="desc">A sanitized comparison of representative blocked near-miss submit batches and the later skill-driven fresh forum submit run.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5c6670"/>
  </marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #17202a; letter-spacing: 0; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5c6670; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; fill: #5c6670; }
    .tiny { font-size: 12px; fill: #5c6670; }
    .metric { font-size: 20px; font-weight: 700; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="54" class="title">Skill system effect: from near-miss loops to routed fresh submissions</text>
<text x="48" y="82" class="subtitle">The comparison is public-safe: it uses run-level counts and failure classes, not alpha expressions.</text>

<rect x="64" y="128" width="456" height="362" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="88" y="162" class="label">Representative blocked near-miss batches</text>
<text x="88" y="190" class="body">Two submit reviews recorded 2 + 5 attempts with no ACTIVE result.</text>
<rect x="92" y="222" width="174" height="78" rx="8" fill="#fdecec" stroke="#d64545"/>
<text x="110" y="250" class="body">ACTIVE outcome</text>
<text x="110" y="278" class="metric">0 / 7</text>
<rect x="310" y="222" width="174" height="78" rx="8" fill="#fff4df" stroke="#c47f17"/>
<text x="328" y="250" class="body">Dominant label</text>
<text x="328" y="278" class="metric">near-miss</text>
<text x="88" y="338" class="label">Observed failure shape</text>
<text x="108" y="366" class="body">self-corr around 0.74-0.91</text>
<text x="108" y="388" class="body">thin sub-universe margins</text>
<text x="108" y="410" class="body">direct group template reuse risk</text>
<text x="108" y="432" class="body">repairs pointed to broader dispersion, not tiny retunes</text>

<rect x="600" y="128" width="456" height="362" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="624" y="162" class="label">Skillized fresh forum/experience run</text>
<text x="624" y="190" class="body">Old ready was ignored; skills selected fresh families and repair routes.</text>
<rect x="628" y="222" width="174" height="78" rx="8" fill="#e8f6ee" stroke="#1f9d55"/>
<text x="646" y="250" class="body">ACTIVE outcome</text>
<text x="646" y="278" class="metric">5 / 5</text>
<rect x="846" y="222" width="174" height="78" rx="8" fill="#fff4df" stroke="#c47f17"/>
<text x="864" y="250" class="body">Submit policy</text>
<text x="864" y="278" class="metric">3 strict + 2 PASS</text>
<text x="624" y="338" class="label">Skill routing that mattered</text>
<text x="644" y="366" class="body">block 0.97+ clone families after an ACTIVE seed</text>
<text x="644" y="388" class="body">shift from book/sales saturation to EPS/dividend quality</text>
<text x="644" y="410" class="body">treat platform PASS and numeric cutoff as separate evidence</text>
<text x="644" y="432" class="body">log each tweak, result, blocker, and next repair action</text>

<line x1="520" y1="309" x2="600" y2="309" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="536" y="286" class="tiny">taxonomy</text>
<text x="536" y="332" class="tiny">routing</text>

<rect x="96" y="534" width="260" height="56" rx="8" fill="#fdecec" stroke="#d64545"/>
<text x="114" y="558" class="body">Old loop risk</text>
<text x="114" y="580" class="label">metrics pass, similarity still kills</text>

<rect x="430" y="534" width="260" height="56" rx="8" fill="#fff4df" stroke="#c47f17"/>
<text x="448" y="558" class="body">Skill system change</text>
<text x="448" y="580" class="label">classify cause before repair</text>

<rect x="764" y="534" width="260" height="56" rx="8" fill="#e8f6ee" stroke="#1f9d55"/>
<text x="782" y="558" class="body">Effect to show</text>
<text x="782" y="580" class="label">fresh, diversified active results</text>

<text x="48" y="622" class="tiny">What this proves: the major change is the skill taxonomy and its measured effect on submit behavior, not another generic agent loop.</text>
</svg>
