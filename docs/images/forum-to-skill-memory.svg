<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Forum experience distilled into skill memory</title>
<desc id="desc">Forum notes, local history, and repair records are classified into reusable skill memory before candidate generation.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5c6670"/>
  </marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #17202a; letter-spacing: 0; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #5c6670; }
    .label { font-size: 15px; font-weight: 700; }
    .body { font-size: 13px; fill: #5c6670; }
    .tiny { font-size: 12px; fill: #5c6670; }
    .metric { font-size: 20px; font-weight: 700; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="54" class="title">Forum experience -> classified skill memory -> fresh candidates</text>
<text x="48" y="82" class="subtitle">The harness treats community notes and local failures as evidence, not prompt-only context.</text>

<rect x="48" y="128" width="230" height="90" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="64" y="158" class="label">Forum and notes</text>
<text x="64" y="184" class="body">recipe hints, caveats, operator</text>
<text x="64" y="202" class="body">patterns, field usage examples</text>

<rect x="48" y="248" width="230" height="90" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="64" y="278" class="label">Local run history</text>
<text x="64" y="304" class="body">check results, submit results,</text>
<text x="64" y="322" class="body">ledger and postmortem records</text>

<rect x="48" y="368" width="230" height="90" rx="8" fill="#f7f9fb" stroke="#d8dde3" stroke-width="2"/>
<text x="64" y="398" class="label">Repair queue</text>
<text x="64" y="424" class="body">near-pass, clone, concentration,</text>
<text x="64" y="442" class="body">coverage and threshold issues</text>

<rect x="372" y="176" width="250" height="234" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
<text x="392" y="208" class="label">Evidence classifier</text>
<text x="392" y="240" class="body">source_family</text>
<text x="392" y="266" class="body">field_signature</text>
<text x="392" y="292" class="body">tag and rationale</text>
<text x="392" y="318" class="body">source run / forum / repair link</text>
<text x="392" y="354" class="tiny">Records stay inspectable before</text>
<text x="392" y="372" class="tiny">they become generation policy.</text>

<rect x="716" y="128" width="350" height="110" rx="8" fill="#e8f6ee" stroke="#1f9d55" stroke-width="2"/>
<text x="736" y="160" class="label">Recipe skills</text>
<text x="736" y="186" class="body">disclosure missingness, value quality,</text>
<text x="736" y="204" class="body">analyst revision, intraday stabilizers</text>

<rect x="716" y="268" width="350" height="110" rx="8" fill="#fff4df" stroke="#c47f17" stroke-width="2"/>
<text x="736" y="300" class="label">Failure-action skills</text>
<text x="736" y="326" class="body">family shift, clone blocker, concentration</text>
<text x="736" y="344" class="body">repair, turnover and coverage repair</text>

<rect x="716" y="408" width="350" height="110" rx="8" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
<text x="736" y="440" class="label">Submit policy skills</text>
<text x="736" y="466" class="body">fresh check, active-correlation boundary,</text>
<text x="736" y="484" class="body">platform PASS vs strict numeric cutoff</text>

<line x1="278" y1="173" x2="372" y2="236" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="278" y1="293" x2="372" y2="293" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="278" y1="413" x2="372" y2="350" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="622" y1="240" x2="716" y2="184" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="622" y1="293" x2="716" y2="323" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="622" y1="350" x2="716" y2="463" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/>

<rect x="90" y="538" width="220" height="62" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="106" y="562" class="body">Candidate identity</text>
<text x="106" y="586" class="metric">expression + settings</text>

<rect x="450" y="538" width="220" height="62" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="466" y="562" class="body">Generation intent</text>
<text x="466" y="586" class="metric">rationale + evidence</text>

<rect x="810" y="538" width="220" height="62" rx="8" fill="#f7f9fb" stroke="#d8dde3"/>
<text x="826" y="562" class="body">Next batch control</text>
<text x="826" y="586" class="metric">fresh, tagged, auditable</text>

<text x="48" y="622" class="tiny">What this proves: forum experience is distilled into typed memory before it can drive candidate generation.</text>
</svg>
